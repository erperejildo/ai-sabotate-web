stages:
  - format
  - test
  - deploy

variables:
  node_version: "20"

default:
  image: mcr.microsoft.com/playwright:v1.49.0-jammy
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3
    - npm ci --no-audit --no-fund
    - npx playwright install --with-deps chromium
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

prettier:
  stage: format
  script:
    - npx prettier --check .

playwright:
  stage: test
  script:
    - npm run test
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 1 week

deploy:pages:
  stage: deploy
  needs: ["prettier", "playwright"]
  image: alpine:3.19
  before_script:
    - apk add --no-cache git bash
  script:
    - git config user.name "GitLab CI"
    - git config user.email "ci@local"
    - git remote add github "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" || true
    - git fetch --depth=1 github gh-pages || true
    - git checkout -B gh-pages
    - git add --all
    - git commit -m "deploy: ${CI_COMMIT_SHORT_SHA}" --allow-empty
    - git push -f https://${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git gh-pages
  environment:
    name: github-pages
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
