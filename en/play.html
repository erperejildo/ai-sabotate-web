  <body>
    <div class="grid-bg" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>

    <header class="nav">
      <div class="wrap nav-inner">
        <a class="brand" href="index.html" aria-label="AI Sabotage home">
          <span class="brand-mark" aria-hidden="true">[</span>
          <span class="brand-name">AI SABOTAGE</span>
          <span class="brand-mark" aria-hidden="true">]</span>
        </a>
        <nav class="nav-links" aria-label="Sections">
          <a href="rig.html" data-i18n="nav.rig" class=""></a>
          <a href="cards.html" data-i18n="nav.cards" class=""></a>
          <a href="protocols.html" data-i18n="nav.protocols" class=""></a>
          <a href="ranking.html" data-i18n="nav.ranking" class=""></a>
          <a href="play.html" data-i18n="nav.play" class="is-active"></a>
        </nav>
        <div class="nav-end">
          <button class="lang-switch" type="button" data-lang-switch="es" aria-label="Switch language"></button>
        </div>
      </div>
    </header>

    <main>
      <section class="subhero">
        <div class="wrap">
          <header class="section-head">
            <p class="kicker" data-i18n="play.kicker"></p>
            <h1 class="section-title" data-i18n="play.heading"></h1>
            <p class="section-sub" data-i18n="play.sub"></p>
          </header>
        </div>
      </section>

      <section class="section section--cta">
        <div class="section-inner">
          <div class="cta-row">
            <a class="btn btn-primary btn-lg" data-store="ios" href="#">
              <span data-i18n="play.ios"></span>
              <span class="btn-sub" data-i18n="play.iosSub"></span>
            </a>
            <a class="btn btn-primary btn-lg" data-store="android" href="#">
              <span data-i18n="play.android"></span>
              <span class="btn-sub" data-i18n="play.androidSub"></span>
            </a>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="section-inner">
          <header class="section-head">
            <h2 class="section-title" data-i18n="play.whatTitle"></h2>
          </header>
          <ul class="play-list">
            <li data-i18n="play.freeLine1"></li>
            <li data-i18n="play.freeLine2"></li>
            <li data-i18n="play.freeLine3"></li>
            <li data-i18n="play.freeLine4"></li>
          </ul>

          <header class="section-head">
            <h2 class="section-title" data-i18n="play.requirementsTitle"></h2>
          </header>
          <div class="play-reqs">
            <article class="play-req">
              <h3 data-i18n="play.ios"></h3>
              <p data-i18n="play.reqIos"></p>
            </article>
            <article class="play-req">
              <h3 data-i18n="play.android"></h3>
              <p data-i18n="play.reqAndroid"></p>
            </article>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p data-i18n="footer.copy"></p>
      <p class="footer-links" id="footer-links">
        <a href="rig.html" data-i18n="nav.rig"></a> · <a href="cards.html" data-i18n="nav.cards"></a> ·
        <a href="protocols.html" data-i18n="nav.protocols"></a> · <a href="ranking.html" data-i18n="nav.ranking"></a> ·
        <a href="play.html" data-i18n="nav.play"></a>
      </p>
    </footer>

    <div class="sr-only" id="store-modal" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal">
        <p class="modal-line">[ STORE LINK ]</p>
        <h3 class="modal-title" id="store-title">Get the game</h3>
        <p class="modal-text" id="store-text">Loading…</p>
        <button type="button" class="btn btn-ghost" data-close data-i18n="hero.modalClose"></button>
      </div>
    </div>

    <script src="../assets/js/config.js" defer></script>
    <script src="../assets/js/i18n.js" defer></script>
    <script src="../assets/js/main.js" defer></script>
